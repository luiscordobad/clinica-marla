<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#28363E">
<title>Sin conexión · Clínica Marla</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F4F6F9; color: #28363E; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 24px; box-sizing: border-box; }
  .caja { background: #fff; border: 1px solid #e2e8f0; border-radius: 24px; padding: 32px; max-width: 340px; text-align: center; }
  img { height: 44px; margin-bottom: 16px; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { font-size: 14px; color: #64748b; margin: 0 0 20px; line-height: 1.5; }
  button { width: 100%; padding: 14px; border: 0; border-radius: 14px; background: #28363E; color: #fff; font-weight: 800; font-size: 15px; }
  @media (prefers-color-scheme: dark) { body { background: #020617; color: #e2e8f0; } .caja { background: #0f172a; border-color: #334155; } img { filter: brightness(0) invert(1); } p { color: #94a3b8; } button { background: #4A6472; } }
</style>
</head>
<body>
  <div class="caja">
    <img src="/logo-marla-firma.png" alt="Marla Polo">
    <h1>Sin conexión a internet</h1>
    <p>Clínica Marla necesita internet para mostrar la agenda y los expedientes. Revisa tu Wi‑Fi o tus datos e inténtalo de nuevo.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
